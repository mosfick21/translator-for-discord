<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Translator for Discord</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <header class="head">
    <img class="head-icon" src="../icons/icon48.png" alt="">
    <div class="head-text">
      <h1>Translator</h1>
      <p id="status" class="status">Loading…</p>
    </div>
    <label class="switch" title="Turn everything on or off (Alt+T)">
      <input type="checkbox" id="enabled">
      <span class="track"></span>
    </label>
  </header>

  <main id="body">

    <section class="card">
      <h2>Messages you read</h2>

      <div class="segmented" id="mode">
        <button type="button" data-value="auto">Translate everything</button>
        <button type="button" data-value="tap">Only when I tap</button>
      </div>
      <p class="hint" id="modeHint"></p>

      <div class="pair">
        <label class="pair-side">
          <span class="pair-label">From</span>
          <select id="source"></select>
        </label>
        <span class="pair-arrow" aria-hidden="true">→</span>
        <label class="pair-side">
          <span class="pair-label">Into</span>
          <select id="target"></select>
        </label>
      </div>
    </section>

    <section class="card">
      <h2>Messages you send</h2>

      <div class="pair">
        <label class="pair-side">
          <span class="pair-label">I write in</span>
          <select id="outgoingSource"></select>
        </label>
        <span class="pair-arrow" aria-hidden="true">→</span>
        <label class="pair-side">
          <span class="pair-label">Send as</span>
          <select id="outgoingTarget"></select>
        </label>
      </div>

      <p class="note">Enter sends exactly what you typed. The
        <span class="note-icon"></span> button in the message box translates
        first, then sends.</p>
    </section>

    <section class="card">
      <h2>Where it runs</h2>
      <div class="segmented wide" id="scope">
        <button type="button" data-value="everywhere">Everywhere</button>
        <button type="button" data-value="server">This server</button>
        <button type="button" data-value="channel">This channel</button>
      </div>
      <p class="hint" id="scopeHint"></p>
    </section>

    <div class="test">
      <button type="button" id="testBtn" class="btn">Test it</button>
      <span id="testResult" class="test-result">Checks the connection.</span>
    </div>

    <p class="foot"><kbd>Alt</kbd>+<kbd>T</kbd> toggles · <kbd>Alt</kbd>+click shows the original</p>
  </main>

  <script src="../src/common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
