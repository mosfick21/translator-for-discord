<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b88ff"/><stop offset="1" stop-color="#4450d8"/>
    </linearGradient>
    <linearGradient id="faceG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe3f6"/>
    </linearGradient>
    <linearGradient id="strawG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fce9a6"/><stop offset="0.5" stop-color="#f1cd6d"/><stop offset="1" stop-color="#d7a747"/>
    </linearGradient>
    <linearGradient id="crownG" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fdeeb4"/><stop offset="1" stop-color="#dfb054"/>
    </linearGradient>
    <linearGradient id="bandG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ee5a5a"/><stop offset="1" stop-color="#b2242d"/>
    </linearGradient>
    <clipPath id="brimClip">
      <path d="M 36 266 C 106 350 406 350 476 266 C 414 196 98 196 36 266 Z"/>
    </clipPath>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#161a44" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#tile)"/>

  <!-- The mascot sits low enough that the brim rests on its head. Its body is a
       rounded blob that narrows to a small point at each bottom corner. -->
  <g filter="url(#drop)">
    <path fill="url(#faceG)" d="
      M 108 276
      C 100 300 104 342 116 380
      C 127 414 143 438 156 449
      C 162 454 170 452 172 445
      L 184 418
      C 207 432 231 438 256 438
      C 281 438 305 432 328 418
      L 340 445
      C 342 452 350 454 356 449
      C 369 438 385 414 396 380
      C 408 342 412 300 404 276
      Z"/>
    <ellipse cx="204" cy="348" rx="28" ry="34" fill="#3d49cf"/>
    <ellipse cx="308" cy="348" rx="28" ry="34" fill="#3d49cf"/>
    <ellipse cx="214" cy="337" rx="9" ry="10" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="318" cy="337" rx="9" ry="10" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- the hat, worn at a slight angle -->
  <g transform="rotate(-6 256 250)">
    <path d="M 36 266 C 106 350 406 350 476 266 C 414 196 98 196 36 266 Z" fill="url(#strawG)"/>
    <g clip-path="url(#brimClip)" stroke="#b78b36" stroke-opacity="0.34" stroke-width="4" fill="none">
      <path d="M256 240 L 36 266"/>  <path d="M256 240 L 70 312"/>
      <path d="M256 240 L 126 342"/> <path d="M256 240 L 190 358"/>
      <path d="M256 240 L 256 362"/> <path d="M256 240 L 322 358"/>
      <path d="M256 240 L 386 342"/> <path d="M256 240 L 442 312"/>
      <path d="M256 240 L 476 266"/>
      <path d="M 36 266 C 106 350 406 350 476 266"/>
      <path d="M 82 258 C 138 330 374 330 430 258"/>
    </g>
    <path d="M 36 266 C 106 350 406 350 476 266 C 414 196 98 196 36 266 Z"
          fill="none" stroke="#a6792a" stroke-width="7"/>
    <path d="M 158 244 C 160 100 352 100 354 244 C 322 272 190 272 158 244 Z"
          fill="url(#crownG)" stroke="#a6792a" stroke-width="7"/>
    <path d="M 159 196 C 208 234 304 234 353 196 L 356 240 C 304 280 208 280 156 240 Z"
          fill="url(#bandG)"/>
  </g>
</svg>
